<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Even Numbers (1 to 20)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .result-box {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 14px;
      margin-top: 18px;
      background-color: #fafafa;
    }
    .result-box p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h2>Even Numbers from 1 to 20</h2>
  <p>Press <code>F12</code> (or open Console) to view console output, or click below to run again.</p>

  <button id="runBtn">Print Even Numbers</button>

  <div class="result-box" id="output">
    <p>Waiting to run...</p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
